name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q -f core.py builder.py main.py Shelf_Command.py tests

      - name: Run Maya-independent unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify Maya-independent imports
        run: |
          python - <<'PY'
          from core import Pose, PoseValidationError, load_pose, resolve_scene_joint

          assert Pose and PoseValidationError and load_pose and resolve_scene_joint
          PY
